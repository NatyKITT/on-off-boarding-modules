name: Mail Worker

on:
  schedule:
    # GitHub Actions cron runs in UTC.
    # 10 6-17 * * * = every day at minute 10 between 06:00 and 17:00 UTC.
    - cron: "10 6-17 * * *"
  workflow_dispatch:

jobs:
  process-mail-queue:
    name: Process mail queue
    runs-on: ubuntu-latest

    steps:
      - name: Process mail queue
        shell: bash
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ]; then
            echo "Error: APP_URL secret is not configured."
            exit 1
          fi

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Error: CRON_SECRET secret is not configured."
            exit 1
          fi

          APP_URL="${APP_URL%/}"
          ENDPOINT="$APP_URL/api/cron/mail-worker"

          echo "Starting mail worker for $APP_URL ..."

          RESPONSE_FILE="$(mktemp)"

          HTTP_STATUS="$(
            curl -sS \
              -X POST \
              -o "$RESPONSE_FILE" \
              -w "%{http_code}" \
              "$ENDPOINT" \
              -H "Authorization: Bearer $CRON_SECRET"
          )"

          RESPONSE="$(cat "$RESPONSE_FILE")"

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response:"
          echo "$RESPONSE"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Error: Mail worker request failed with HTTP status $HTTP_STATUS."
            exit 1
          fi

          if ! echo "$RESPONSE" | jq empty >/dev/null 2>&1; then
            echo "Error: Mail worker returned invalid JSON response."
            exit 1
          fi

          PROCESSED="$(echo "$RESPONSE" | jq -r '.processed // 0')"
          SUCCEEDED="$(echo "$RESPONSE" | jq -r '.succeeded // 0')"
          FAILED="$(echo "$RESPONSE" | jq -r '.failed // 0')"

          echo "Processed: $PROCESSED"
          echo "Succeeded: $SUCCEEDED"
          echo "Failed: $FAILED"

          if ! [[ "$FAILED" =~ ^[0-9]+$ ]]; then
            echo "Error: Mail worker returned invalid failed count: $FAILED"
            exit 1
          fi

          if [ "$FAILED" -gt 0 ]; then
            echo "Error: Mail worker finished with failed jobs: $FAILED"
            exit 1
          fi

          echo "Mail worker finished successfully."
