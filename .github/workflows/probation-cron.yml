name: Probation Check

on:
  schedule:
    # GitHub cron běží v UTC. Tohle je 08:00 v Praze během letního času.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment, ve kterém jsou secrets APP_URL a CRON_SECRET"
        type: choice
        required: true
        default: production
        options:
          - dev
          - production

permissions:
  contents: read

concurrency:
  group: probation-check-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  probation-check:
    name: Check probation evaluations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}

    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Run probation cron endpoint
        id: probation
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ]; then
            echo "::error::Missing GitHub Environment secret APP_URL"
            exit 1
          fi

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Missing GitHub Environment secret CRON_SECRET"
            exit 1
          fi

          APP_URL="${APP_URL%/}"

          echo "Starting probation check for $APP_URL ..."

          response=$(curl -sS --retry 2 --retry-delay 5 --retry-all-errors --max-time 120 -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "$APP_URL/api/cron/probation-notifications")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP Status: $http_code"
          echo "Response:"
          echo "$body" | jq '.' 2>/dev/null || echo "$body"

          if [ "$http_code" != "200" ]; then
            echo "::error::Probation check failed with status $http_code"
            echo "::error::Response: $body"
            exit 1
          fi

          status=$(echo "$body" | jq -r '.status // "unknown"' 2>/dev/null || echo "unknown")

          if [ "$status" != "success" ]; then
            echo "::error::Probation check returned non-success status: $status"
            echo "::error::Response: $body"
            exit 1
          fi

          notifications=$(echo "$body" | jq -r '.notifications | length' 2>/dev/null || echo "0")
          at21Days=$(echo "$body" | jq -r '.stats.at21Days // 0' 2>/dev/null || echo "0")
          weeklyRemindersChecked=$(echo "$body" | jq -r '.stats.weeklyRemindersChecked // 0' 2>/dev/null || echo "0")
          at3Days=$(echo "$body" | jq -r '.stats.at3Days // 0' 2>/dev/null || echo "0")

          echo "notifications=$notifications" >> "$GITHUB_OUTPUT"
          echo "at21Days=$at21Days" >> "$GITHUB_OUTPUT"
          echo "weeklyRemindersChecked=$weeklyRemindersChecked" >> "$GITHUB_OUTPUT"
          echo "at3Days=$at3Days" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        shell: bash
        run: |
          echo "## Probation Check Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: ${{ steps.probation.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Notifications: ${{ steps.probation.outputs.notifications }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 21 days: ${{ steps.probation.outputs.at21Days }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Weekly reminders checked: ${{ steps.probation.outputs.weeklyRemindersChecked }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 3 days HR reminders: ${{ steps.probation.outputs.at3Days }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"
